<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LOCAL CARTRIDGE | コードプレビューランチャー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="app">

  <header class="app__header">
    <div class="brand">
      <span class="brand__mark">&#9707;</span>
      <div class="brand__text">
        <h1>LOCAL CARTRIDGE</h1>
        <p>html / css / js を差し込んでその場で実行</p>
      </div>
    </div>
    <div class="cache-badge" id="cacheBadge">
      <span class="cache-badge__dot" id="cacheDot"></span>
      <span id="cacheBadgeText">キャッシュ未使用</span>
    </div>
  </header>

  <main class="workbench">

    <section class="slots" aria-label="ファイル投入スロット">

      <div class="slot" data-type="html" id="slot-html">
        <div class="slot__top">
          <span class="slot__tag slot__tag--html">HTML</span>
          <span class="slot__req">必須</span>
        </div>
        <div class="slot__drop" id="drop-html">
          <p class="slot__file" id="name-html">ファイル未選択</p>
          <p class="slot__hint">クリック or ドラッグ&amp;ドロップ</p>
        </div>
        <input type="file" accept=".html,.htm" id="input-html" hidden>
      </div>

      <div class="slot" data-type="css" id="slot-css">
        <div class="slot__top">
          <span class="slot__tag slot__tag--css">CSS</span>
          <span class="slot__req">任意</span>
        </div>
        <div class="slot__drop" id="drop-css">
          <p class="slot__file" id="name-css">ファイル未選択</p>
          <p class="slot__hint">クリック or ドラッグ&amp;ドロップ</p>
        </div>
        <input type="file" accept=".css" id="input-css" hidden>
      </div>

      <div class="slot" data-type="js" id="slot-js">
        <div class="slot__top">
          <span class="slot__tag slot__tag--js">JS</span>
          <span class="slot__req">任意</span>
        </div>
        <div class="slot__drop" id="drop-js">
          <p class="slot__file" id="name-js">ファイル未選択</p>
          <p class="slot__hint">クリック or ドラッグ&amp;ドロップ</p>
        </div>
        <input type="file" accept=".js" id="input-js" hidden>
      </div>

      <div class="slots__actions">
        <button type="button" class="btn btn--primary" id="runBtn" disabled>実行する</button>
        <button type="button" class="btn btn--ghost" id="clearBtn">キャッシュ削除</button>
      </div>

      <p class="log" id="logText">3つのファイルはブラウザに保存され、キャッシュを消さない限り次回開いた時も残ります。</p>

    </section>

    <section class="preview">
      <div class="preview__bar">
        <span class="preview__label">PREVIEW</span>
        <span class="preview__state" id="previewState">未実行</span>
      </div>
      <iframe
        id="previewFrame"
        title="プレビュー"
        sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-pointer-lock"
      ></iframe>
    </section>

  </main>

  <footer class="app__footer">
    made by <a href="https://github.com/h1ro223" target="_blank" rel="noopener noreferrer">hiro / ヒロ</a>
  </footer>

</div>

<script src="./script.js"></script>
</body>
</html>
